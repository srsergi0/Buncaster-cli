name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Target image name in ghcr.io (e.g. srsergi0/buncaster or srsergi0/buncaster-cli)'
        required: false
        default: 'srsergi0/buncaster'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Image Names
        id: image-names
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.repository }}"
          if [ -n "${{ inputs.image_name }}" ]; then
            TARGETS="ghcr.io/${{ inputs.image_name }}"
          elif [ "${REPO,,}" = "${OWNER,,}/buncaster-cli" ]; then
            # Fork CLI only pushes its own image (no permission to overwrite buncaster)
            TARGETS="ghcr.io/${REPO,,}"
          else
            TARGETS="ghcr.io/${OWNER,,}/buncaster"
            if [ "${REPO,,}" != "${OWNER,,}/buncaster" ]; then
              TARGETS="${TARGETS}\nghcr.io/${REPO,,}"
            fi
          fi
          echo -e "targets<<EOF\n${TARGETS}\nEOF" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-names.outputs.targets }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
